[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bean-forming-lab"
version = "0.1.0"
description = "Experiments in multichannel audio and acoustic beamforming"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=7", "matplotlib>=3.8"]

[project.scripts]
bean-lab = "bean_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
